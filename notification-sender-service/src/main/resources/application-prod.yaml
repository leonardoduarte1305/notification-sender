spring:
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    admin:
      auto-create: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: notification-sender-service-consumer
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:key}:${POSTGRES_PORT:key}/${POSTGRES_DB:key}
    username: ${POSTGRES_USER:key}
    password: ${POSTGRES_PASSWORD:key}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    default-schema: public
    liquibase-schema: public
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  jpa:
    open-in-view: false
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
    version: openapi_3_0
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /api-docs
app:
  security:
    x-api-key: ${X_API_KEY}
  kafka:
    email:
      topico-dlq-envio-falho: emails-nao-enviados-dlq